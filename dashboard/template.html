<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>업무 노트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--bg:#121110;--panel:#171614;--card:#1d1c19;--line:#2c2a26;--text:#ebe6dc;--mute:#948d80;--accent:#d2ab7c;--accent-soft:#2b241b;--hl:#d2ab7c;--hl-ink:#1b150d;--alt:#9fb59a;--gold:#d9b06a;--warn:#d9b06a;--warn-bg:#2a2418;--serif:'Noto Serif KR',Georgia,serif}
@media (prefers-color-scheme:light){:root{--bg:#f6f3ec;--panel:#efebe2;--card:#fffdf8;--line:#e1dbcf;--text:#26221c;--mute:#7a7366;--accent:#97683a;--accent-soft:#f1e7d8;--hl:#97683a;--hl-ink:#fffdf8;--alt:#5e7a58;--gold:#9a6b1f;--warn:#7a5312;--warn-bg:#f8efdf}}
*{box-sizing:border-box}
input[type=checkbox],input[type=radio]{accent-color:var(--hl)}
::selection{background:rgba(210,171,124,.3)}
html,body{height:100%}
/* 스크롤바: 어두운 테마에 맞춘 얇은 막대. 패널은 가로 스크롤 없음 */
*{scrollbar-width:thin;scrollbar-color:#3a4260 transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c3350;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--hl);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none}
.col,#leftbody,.rscroll,.rblock,.bpanel,.main,.left{overflow-x:hidden!important}
.left *,.right *{min-width:0}
@media (prefers-color-scheme:light){*{scrollbar-color:#b9c0d3 transparent}::-webkit-scrollbar-thumb{background:#c3c9da;background-clip:padding-box}}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 'Pretendard Variable',Pretendard,system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;letter-spacing:-.005em;font-feature-settings:'ss06';overflow:hidden}
.app{display:grid;grid-template-columns:var(--lw,270px) minmax(0,1fr) var(--rw,310px);height:100vh}
.col{overflow:auto;min-height:0}
.left{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;position:relative}
.right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;position:relative}
.main{padding:28px 36px 36px;display:flex;flex-direction:column;min-height:0}
.brand{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:-.01em;margin:2px 4px 12px}
.seg{display:flex;background:var(--line);border-radius:9px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:6px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input.search{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit;font-size:13px;margin:0 0 10px;outline:none}
input.search:focus{border-color:var(--accent)}
#leftbody{flex:1;min-height:0;overflow:auto;margin:0 -4px;padding:0 4px}
.sec{font-size:11px;letter-spacing:.04em;color:var(--mute);margin:16px 4px 6px;font-weight:700}
.sec0{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.04em;margin:0 0 8px}
.sec0 em{font-style:normal;color:var(--mute);margin-left:4px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px}
.calhead b{font-weight:650}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dw{font-size:11px;color:var(--mute);padding:2px 0}
.cd{position:relative;background:none;border:0;color:var(--text);padding:6px 0;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
.cd:hover{background:rgba(127,127,127,.12)}
.cd.today{outline:1px solid var(--accent)}
.cd.sel{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cd i{position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.cd.blank{visibility:hidden}
.list{border:1px solid var(--line);border-radius:11px;background:var(--card);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.row:first-child{border-top:0}
.row>span:last-child{color:var(--mute);font-size:12px;text-align:right;white-space:nowrap}
.row .t{color:var(--text);min-width:0}
.row.btn{width:100%;border:0;background:none;text-align:left;font:inherit;color:var(--text);cursor:pointer}
.row.btn:hover,.nav-item:hover{background:rgba(127,127,127,.12)}
.empty{color:var(--mute);font-size:13px;padding:12px}
.nav-item{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:5px 8px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.sub{padding-left:22px;color:var(--mute)}
.hubcard{margin-bottom:12px}
.hc-t{font-size:13px;font-weight:650;padding:4px 8px;display:flex;align-items:center;justify-content:space-between}
.hc-t em{font-style:normal;color:var(--mute);font-size:12px;font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;font-weight:400;white-space:nowrap;display:inline-block;line-height:1.6}
.mail{padding:9px 14px;border-top:1px solid var(--line)}
.mail:first-child{border-top:0}
.mf{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ms{font-size:13px;margin-top:2px}
.rblock{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.rblock.grow{flex:1 1 0;min-height:0;overflow:auto}
.rblock.fix{flex:none;max-height:34%;overflow:auto}
.rblock:last-child{border-bottom:0}
.rblock .search{margin-bottom:8px}
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.crumb{font-size:12px;color:var(--mute);margin-bottom:6px}
h1.title{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.3}
.bigbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:14px;cursor:pointer;font:inherit;margin:4px 0 6px}
.bigbtn b{display:block;font-size:14px;margin-bottom:4px}.bigbtn span{font-size:12px;color:var(--mute);line-height:1.5}
.bigbtn:hover,.bigbtn.on{border-color:var(--hl)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.ptx{height:170px;resize:vertical;margin:0}.ptx2{min-height:480px;resize:vertical;margin:0;font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:12.5px;line-height:1.6}
.pview{border:1px solid var(--line);border-radius:10px;padding:16px;min-height:480px;max-height:70vh;overflow:auto}
.chk{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.btn-s.pri{background:var(--hl);color:var(--hl-ink);border-color:var(--hl);font-weight:700}
.linkb{border:0;background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer;padding:0;min-width:0}
.xbtn{border:0;background:none;color:var(--mute);cursor:pointer;font-size:14px;margin-left:4px}
.row.sk .t small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px;line-height:1.4}
.kobox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13.5px;line-height:1.6;background:rgba(127,127,127,.06)}
.hub.sub2{margin-left:14px}
textarea.search,select.search{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;font-size:13px;outline:none;line-height:1.55}
textarea.search:focus,select.search:focus{border-color:var(--hl)}
select.search option{background:var(--card);color:var(--text)}
input.search::placeholder,textarea.search::placeholder{color:var(--mute)}
.rblock.grow,.rblock.fix{display:flex;flex-direction:column;overflow:hidden}
.rblock.fix{max-height:30%}
.rscroll{flex:1 1 auto;min-height:0;overflow-y:auto}
.skrow{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--text);font:inherit;padding:10px 12px;cursor:pointer}
.skrow:first-child{border-top:0}.skrow:hover{background:rgba(127,127,127,.12)}
.skr-t{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.skr-n{display:block;font-size:11px;color:var(--accent);font-family:ui-monospace,Consolas,monospace;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skr-d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--mute);line-height:1.45;margin-top:4px}
.skcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:rgba(127,127,127,.05);margin:12px 0}
.skc-h{display:flex;flex-direction:column;gap:3px}.skc-h b{font-size:16px}.skc-h code{font-size:12px;color:var(--accent)}
.skc-d{margin:10px 0 0;font-size:13.5px;line-height:1.65}
.skc-o{margin-top:8px;font-size:12.5px;color:var(--mute)}.skc-o summary{cursor:pointer}.skc-o p{line-height:1.6;margin:6px 0 0}
.skc-m{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:12px 0 0;font-size:12px}.skc-m dt{color:var(--mute)}.skc-m dd{margin:0;word-break:break-all}
.skprev{font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.bpanel.wide{width:440px}
.steps{display:flex;gap:6px;margin:10px 0 16px;flex-wrap:wrap}
.steps span{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.steps span.on{border-color:var(--hl);color:var(--text);background:rgba(210,171,124,.12)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard .sec0{margin:0}
.prow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--hl);border-color:var(--hl);color:var(--hl-ink);font-weight:700}
.pskill{flex:1;min-width:220px;width:auto}
.pgrid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:14px;align-items:start}
.pgrid2 .pcard{margin-bottom:14px}
@media (max-width:1400px){.pgrid2{grid-template-columns:1fr}}
.smap{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(112px,1fr);gap:22px;padding:4px 2px 8px;overflow-x:auto}
.pyr{position:relative;display:flex;flex-direction:column;gap:30px;padding:6px 2px 10px}
.pyr-row{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.pyr-h{align-self:flex-start;display:flex;gap:8px;align-items:baseline;font-size:11px;color:var(--mute)}
.pyr-h b{color:var(--text);font-size:11.5px;letter-spacing:.03em}
.pyr-nodes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:var(--w);min-width:min(100%,260px);max-width:100%}
.pyr-nodes .snode{flex:1 1 130px;max-width:210px}
.pyr-row[data-layer="최종"] .snode{flex-basis:220px;max-width:320px;text-align:center;align-items:center;border-color:rgba(217,176,106,.55);background:rgba(217,176,106,.06)}
.pyr-row[data-layer="최종"] .snode b{font-size:14px}
.snode .sk-tag{font-style:normal;font-size:10.5px;color:var(--alt);font-family:ui-monospace,Consolas,monospace}
.skm{display:flex;flex-direction:column;gap:6px}
.skm-c{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:7px 10px;font:inherit;cursor:pointer}
.skm-c b{font-size:12.5px;font-weight:600}.skm-c code{font-size:11px;color:var(--alt);align-self:center}
.skm-c small{grid-column:1/-1;font-size:11px;color:var(--mute)}
.skm-c:hover{border-color:var(--accent)}.skm-c.on{border-color:var(--alt);background:rgba(159,181,154,.08)}
.snode.draft{border-left:3px dashed var(--gold)}.snode.draft i{color:var(--gold)}
.ins-h .lay{display:inline-block;font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:6px;background:rgba(210,171,124,.15);color:var(--hl);margin-bottom:4px}
.btn-s[disabled]{opacity:.4;cursor:default}
.slinks{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.slinks path{fill:none;stroke:rgba(210,171,124,.32);stroke-width:1.4}.slinks path.on{stroke:var(--hl);stroke-width:2.2}
.scol{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.scol-h{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.05em}
.snode{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.snode b{font-size:13px}.snode span{font-size:11px;color:var(--mute);word-break:break-all}.snode i{font-style:normal;font-size:10.5px;color:var(--hl)}
.snode:hover{border-color:var(--accent)}.snode.on{border-color:var(--hl);}.snode.req{border-left:3px solid var(--hl)}
#ins{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}.fld .search{margin:0}
.ins-h b{display:block;font-size:15px;color:var(--text)}.ins-h span{font-size:12px;color:var(--mute)}
.hgrip{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:5}
.hgrip.lg{left:auto;right:-4px}
.hgrip:hover,.dragging .hgrip{background:rgba(210,171,124,.35)}
.vgrip{flex:none;height:7px;margin:-3px 0;cursor:row-resize;position:relative;z-index:4}
.vgrip::after{content:'';position:absolute;left:50%;top:2px;width:36px;height:3px;margin-left:-18px;border-radius:2px;background:var(--line)}
.vgrip:hover::after{background:var(--hl)}
.hgrip2{flex:none;width:8px;margin:0 -4px;cursor:col-resize;position:relative;z-index:4}
.hgrip2::after{content:'';position:absolute;top:50%;left:2px;height:40px;width:3px;margin-top:-20px;border-radius:2px;background:var(--line)}
.hgrip2:hover::after{background:var(--hl)}
.dragging{cursor:grabbing;user-select:none}.dragging canvas{pointer-events:none}
.bpanel.wide{width:460px}
.bpanel{max-width:62%}
.rcrow .t i{font-style:normal;font-size:10px;padding:1px 5px;border-radius:6px;margin-right:5px;vertical-align:1px}
.rcrow .t i.new{background:var(--gold);color:#1a1408}.rcrow .t i.sk{background:rgba(255,169,92,.18);color:#ffa95c}
.rcrow.on{background:var(--accent-soft)}.rclist .more{justify-content:center;color:var(--mute);font-size:12px}
.sec .live{font-style:normal;color:#6fe39a;font-size:9px;vertical-align:2px}.sec .live.off{color:var(--mute)}
.mdtable{overflow-x:auto;margin:10px 0}
.mdtable table{border-collapse:collapse;font-size:13px;min-width:60%}
.mdtable th,.mdtable td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top;line-height:1.5}
.mdtable th{background:rgba(210,171,124,.12);font-weight:600}
.mdtable tbody tr:nth-child(even) td{background:rgba(127,127,127,.05)}
.mdcode{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;overflow-x:auto;white-space:pre;margin:10px 0}
.npprev{font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.cmbox{flex:none;border:1px solid var(--line);border-radius:12px;padding:14px;margin:18px 0 8px;display:flex;flex-direction:column;gap:8px;background:rgba(210,171,124,.04)}
.cmbox .sec0{margin:0}.cmbox .search{margin:0}
.cm{border-left:3px solid var(--hl);background:var(--card);border-radius:8px;padding:8px 10px;position:relative}
.cm blockquote{margin:0 0 4px;padding:0 0 0 8px;border-left:2px solid var(--line);color:var(--mute);font-size:12px;line-height:1.5}
.cm p{margin:0;font-size:13px;line-height:1.55;white-space:pre-wrap;padding-right:60px}
.cm-f{position:absolute;right:8px;top:6px;font-size:11px;color:var(--mute)}
.cmout summary{cursor:pointer;font-size:12px;color:var(--mute)}
.cmout pre{white-space:pre-wrap;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 0;max-height:260px;overflow:auto}
.seg2{display:flex;background:var(--line);border-radius:9px;padding:3px}
.seg2 button{border:0;background:none;color:var(--mute);padding:5px 14px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
.seg2 button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.meta{font-size:12px;color:var(--mute);margin:2px 0}
.brainwrap{display:flex;gap:14px;flex:1;min-height:0}
.gmsg{position:absolute;inset:auto 0 45% 0;text-align:center;color:var(--mute);font-size:13px;pointer-events:none}
.gfoot{position:absolute;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 14px;pointer-events:none}
.gstat{font-size:12px;color:#948d80;pointer-events:none}.gstat b{color:#e2dbcd;font-weight:600}
.gleg{display:flex;gap:12px;font-size:11.5px;color:#948d80;pointer-events:none}
.gleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.gleg i.f{background:transparent;border:1.4px solid #d9b06a}
input.gq{width:220px;margin:0}
.flowS{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 10px;padding:10px 14px}
.flowS summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline;list-style:none}
.flowS summary::-webkit-details-marker{display:none}
.fs-t{font-weight:650}.fs-m{font-size:12px;color:var(--mute)}
.flowL{margin:10px 0 2px;padding:0 0 0 4px;list-style:none;border-left:1px solid var(--line)}
.flowL li{position:relative;padding:4px 0 4px 14px;font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.flowL li::before{content:"";position:absolute;left:-4px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--hl)}
.flowL li i{font-style:normal;color:var(--mute);font-size:11.5px;min-width:88px}
.fl-k{font-size:11.5px;color:var(--alt);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.flowL code{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px}
.mapbox{position:relative;flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:radial-gradient(ellipse at 50% 42%,#1d1a15 0%,#141311 62%,#0f0e0c 100%);overflow:hidden}

</style></head><body>
<div class="app">
  <aside class="col left">
    <div class="brand">업무 노트</div>

    <div class="hgrip lg" data-rs="lw" title="끌어서 왼쪽 칸 너비 조절 · 두 번 누르면 원래대로"></div>
  </aside>
  <main class="col main" id="main"></main>
  <aside class="col right" id="right"></aside>
</div>
<script>
const D=/*DATA*/null;
if(!D){document.addEventListener('DOMContentLoaded',()=>{document.body.innerHTML='<div style="padding:40px;font:15px/1.7 system-ui,&quot;Malgun Gothic&quot;,sans-serif;color:#ccc;background:#0a0c11;height:100vh"><b>이 파일은 템플릿입니다.</b><br>dashboard 폴더의 <b>index.html</b>을 여세요.<br>내용을 바꾼 뒤에는 <code>node dashboard/build.mjs</code>를 실행하면 index.html이 새로 만들어집니다.</div>'});throw new Error('template only');}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const fmtDate=s=>{const[y,m,d]=s.split('-').map(Number);return m+'월 '+d+'일 ('+'일월화수목금토'[new Date(y,m-1,d).getDay()]+')'};
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'};

let prof=localStorage.getItem('prof')||'home', cur=null, q='', brainView='graph';
let selG=null, selN=null, spin=true, rot=0, ringA=0, hovered=null, W=0, H=0, ctxG=null, rafId=0, lastT=0;
let camX=0, camY=0, camS=1;
const FOCUS_S=3.4;
// 파일이 많은 분야는 화면 안에 다 들어오도록 덜 확대한다
function focusS(){const c=selG&&CATS.find(x=>x.g===selG);if(!c)return FOCUS_S;const m=c.notes.length,ring=m>60?3:m>6?2:1,outer=7+Math.sqrt(m)*3.2+26+(ring-1)*22+14;return Math.max(1.3,Math.min(FOCUS_S,Math.min(W,H)*0.44/outer))}
let calM=new Date(); calM.setDate(1); let calSel=todayStr();
let skQ='', pqIn='', pqOut='', view='brain', pSkill='.claude/skills/skill-studio/SKILL', pFull=false, pAppr=true, pMode='edit';
const PH=()=>{try{return JSON.parse(localStorage.getItem('prompts')||'[]')}catch(e){return []}};

const LABEL={core:'지침',finance:'자금업무',accounting:'회계',gamedev:'게임개발',media:'미디어 콘텐츠',report:'보고서·분석',secretary:'일정·메일 비서',MEMORY:'기억',inbox:'임시 보관함',projects:'프로젝트',archive:'보관함',routines:'루틴',skills:'스킬',github:'GitHub 프로젝트',recent:'최근 작업'};
const COLOR={core:'#dcc9a0',finance:'#d8896a',accounting:'#d6b768',gamedev:'#8fbf87',media:'#7ea6c8',report:'#a898c6',secretary:'#cc8ea4',skills:'#d4a26b',github:'#85b5b2',routines:'#94b9a6',MEMORY:'#aaa498',inbox:'#8f8a80',projects:'#8f8a80',archive:'#6f6b63',recent:'#e0b878'};
const ORDER=['core','finance','accounting','gamedev','media','report','secretary','skills','github','routines','MEMORY','inbox','projects','archive'];
const SECOND=['finance','accounting','gamedev','media','report','secretary'];

const ALL=[...D.notes,...(D.extra||[])];
const byId=new Map(ALL.map(n=>[n.id,n]));
const back=new Map(ALL.map(n=>[n.id,[]]));
ALL.forEach(n=>n.links.forEach(t=>{if(back.has(t))back.get(t).push(n.id)}));
const hubs=D.notes.filter(n=>n.hub);
const P=()=>D.profiles[prof]||D.profiles.home||{focus:[],connectors:[]};
const focusIds=()=>new Set(P().focus.map(f=>'second-brain/'+f));
const scopeOk=s=>!s||s==='common'||s===prof;
const catNotes=g=>ALL.filter(n=>n.group===g&&!n.name.startsWith('_'));
const evOn=ds=>D.calendar.events.filter(e=>e.date===ds);
// 지도는 큰 분야 5개로 묶는다
const SUPER=[
  {g:'work',label:'업무',sub:['finance','accounting','report','secretary']},
  {g:'create',label:'창작',sub:['gamedev','media']},
  {g:'tools',label:'스킬·루틴',sub:['skills','routines']},
  {g:'proj',label:'프로젝트',sub:['recent','github','projects']},
  {g:'record',label:'기록',sub:['core','MEMORY','inbox','archive']}];
const SUPER_OF={};SUPER.forEach(s=>s.sub.forEach(x=>SUPER_OF[x]=s.g));
const supOf=g=>SUPER_OF[g]||'record';
Object.assign(COLOR,{work:'#d8896a',create:'#8fbf87',tools:'#d4a26b',proj:'#85b5b2',record:'#aaa498'});
Object.assign(LABEL,{work:'업무',create:'창작',tools:'스킬·루틴',proj:'프로젝트',record:'기록'});
// second-brain/ 의 허브 파일을 읽어 분야를 자동 등록한다.
// 허브 frontmatter: title(표시 이름), color(#색상), area(work=업무 | create=창작)
const PAL=['#d8896a','#d6b768','#8fbf87','#7ea6c8','#a898c6','#cc8ea4','#c9a27e','#86b4a8'];
hubs.forEach((hb,i)=>{const g=hb.group,m=hb.meta||{};
  if(m.title)LABEL[g]=m.title;else if(!LABEL[g])LABEL[g]=g;
  if(m.color)COLOR[g]=m.color;else if(!COLOR[g])COLOR[g]=PAL[i%PAL.length];
  if(!SECOND.includes(g))SECOND.push(g);
  if(!ORDER.includes(g))ORDER.splice(1,0,g);
  const want=m.area==='create'?'create':m.area==='work'?'work':(SUPER_OF[g]||'work');
  SUPER.forEach(s=>{const k=s.sub.indexOf(g);if(k>=0&&s.g!==want)s.sub.splice(k,1)});
  const s=SUPER.find(x=>x.g===want);if(!s.sub.includes(g))s.sub.push(g);SUPER_OF[g]=want;
});
const CATS=SUPER.map(s=>({g:s.g,label:s.label,sub:s.sub.filter(x=>catNotes(x).length),notes:s.sub.flatMap(catNotes)})).filter(c=>c.notes.length);

// ---- 마크다운 표시와 [[링크]]
function findNote(l){const t=l.split('|')[0].split('#')[0].trim();
  return byId.get(t)||D.notes.find(n=>n.name===t.split('/').pop())}
function inline(s){
  return esc(s).replace(/\[\[([^\]]+)\]\]/g,(m,l)=>{const raw=l.replace(/&#39;/g,"'"),n=findNote(raw),show=esc(raw.split('|')[1]||n?.title||raw);
      return n?'<span class="wl" data-id="'+esc(n.id)+'">'+show+'</span>':'<span class="wl bad">'+show+'</span>'})
    .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
// 표 한 줄을 칸으로 나눈다 ([[링크|별칭]] 안의 | 와 \| 는 칸 구분이 아니다)
function cells(l){
  const s=l.trim().replace(/^\|/,'').replace(/\|$/,''), out=[];let cur='',depth=0;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(c==='\\'&&s[i+1]==='|'){cur+='|';i++;continue}
    if(c==='['&&s[i+1]==='['){depth++;cur+='[[';i++;continue}
    if(c===']'&&s[i+1]===']'&&depth){depth--;cur+=']]';i++;continue}
    if(c==='|'&&!depth){out.push(cur.trim());cur='';continue}
    cur+=c}
  out.push(cur.trim());return out;
}
const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
function md(t){
  let out='',list=null;const end=()=>{if(list){out+='</'+list+'>';list=null}};
  const L=t.split('\n');let fence=null,tbl=null;
  const endT=()=>{if(tbl){out+='</tbody></table></div>';tbl=null}};
  let skip=-1;
  L.forEach((l,i)=>{let m;
    if(i===skip)return;
    // ``` 코드 블록
    if(fence!==null){if(/^\s*```/.test(l)){out+='<pre class="mdcode">'+esc(fence)+'</pre>';fence=null}else fence+=(fence?'\n':'')+l;return}
    if(/^\s*```/.test(l)){end();endT();fence='';return}
    // 표: 제목 줄 + 구분선(---) 다음부터 내용 줄
    if(tbl){if(/^\s*\|/.test(l)||(l.includes('|')&&l.trim())){const c=cells(l);out+='<tr>'+tbl.map((_,j)=>'<td'+(tbl[j]?' style="text-align:'+tbl[j]+'"':'')+'>'+inline(c[j]||'')+'</td>').join('')+'</tr>';return}endT()}
    if(l.includes('|')&&L[i+1]!==undefined&&isSep(L[i+1])){end();
      const head=cells(l);tbl=cells(L[i+1]).map(s=>/^:-+:$/.test(s)?'center':/-:$/.test(s)?'right':'');
      while(tbl.length<head.length)tbl.push('');
      out+='<div class="mdtable"><table><thead><tr>'+head.map((h,j)=>'<th'+(tbl[j]?' style="text-align:'+tbl[j]+'"':'')+'>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>';
      tbl=tbl.slice(0,head.length);skip=i+1;return}
    if(m=l.match(/^(#{1,3}) (.*)/)){end();out+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>'}
    else if(m=l.match(/^\s*- (.*)/)){if(list!=='ul'){end();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>'}
    else if(m=l.match(/^\s*\d+\. (.*)/)){if(list!=='ol'){end();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>'}
    else if(!l.trim()){end();endT()}
    else{end();out+='<p>'+inline(l)+'</p>'}});
  if(fence!==null)out+='<pre class="mdcode">'+esc(fence)+'</pre>';
  end();endT();return out;
}

// ---- 왼쪽: 회사는 캘린더와 오늘 업무, 집은 개발·콘텐츠 자료
function calHTML(){
  const y=calM.getFullYear(), m=calM.getMonth(), first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), td=todayStr();
  const cells=[];
  for(let i=0;i<first;i++)cells.push('<span class="cd blank"></span>');
  for(let d=1;d<=days;d++){const ds=y+'-'+pad(m+1)+'-'+pad(d), cls=['cd'];
    if(ds===td)cls.push('today'); if(ds===calSel)cls.push('sel');
    cells.push('<button class="'+cls.join(' ')+'" data-day="'+ds+'">'+d+(evOn(ds).length?'<i></i>':'')+'</button>')}
  return '<div class="calhead"><button class="btn-s" data-cm="-1">‹</button><b>'+y+'년 '+(m+1)+'월</b><button class="btn-s" data-cm="1">›</button></div>'
    +'<div class="cgrid">'+['일','월','화','수','목','금','토'].map(w=>'<span class="dw">'+w+'</span>').join('')+cells.join('')+'</div>';
}
function evRows(list){return list.map(e=>'<div class="row"><span class="t">'+esc(e.title)+'</span><span>'+esc(e.time)+'</span></div>').join('')}
function weeklyHTML(td){
  const W=D.weekly; if(!W)return '';
  const wd=new Date(td+'T00:00:00').getDay(), inWeek=td>=W.start&&td<=W.end;
  const row=x=>'<div class="row"><span class="t" style="'+(x.done?'opacity:.55;text-decoration:line-through':'')+'">'+(x.ref?'· ':(x.done?'☑ ':'☐ '))+esc(x.t)+'</span></div>';
  let h='<div class="sec">오늘 업무 (노션 Weekly To-do)</div><div class="list">';
  if(!inWeek)h+='<div class="empty">노션 페이지가 '+esc(W.start)+' ~ '+esc(W.end)+' 주간입니다. 새 주로 동기화가 필요합니다. (weekly-todo-sync)</div>';
  else{
    const items=(W.days[wd]||[]);
    h+=(items.map(row).join('')||'<div class="empty">오늘 적힌 업무가 없습니다.</div>');
    if((W.daily||[]).length)h+='<div class="row"><span class="t" style="color:var(--mute)">매일 해야하는 일</span></div>'+W.daily.map(row).join('');
    if((W.carry||[]).length)h+='<div class="row"><span class="t" style="color:var(--mute)">지난주에 못한 일</span></div>'+W.carry.map(row).join('');
  }
  return h+'<a class="row btn" href="'+esc(W.url)+'" target="_blank" rel="noopener"><span class="t">노션에서 열기</span><span>'+esc(W.synced)+' 동기화</span></a></div>';
}
// ---- 최근 Claude 작업: 훅이 기록한 md·스킬 파일 (새 파일이 생기면 실시간으로 갱신)
let rcMore=false;
function ago(iso){const s=(Date.now()-new Date(iso))/1000;
  return s<60?'방금':s<3600?Math.floor(s/60)+'분 전':s<86400?Math.floor(s/3600)+'시간 전':s<86400*7?Math.floor(s/86400)+'일 전':iso.slice(0,10)}
function recentHTML(){
  const R=(D.recent||[]).filter(r=>byId.get(r.id));
  if(!R.length)return '<div class="sec">최근 Claude 작업</div><p class="foot">Claude가 md나 스킬 파일을 만들면 여기에 바로 나타납니다.</p>';
  const show=rcMore?R.slice(0,40):R.slice(0,6);
  return '<div class="sec">최근 Claude 작업 <em class="live" title="실시간 연결">●</em> '+R.length+'</div><div class="list rclist">'
    +show.map(r=>{const n=byId.get(r.id),nw=(Date.now()-new Date(r.at))<600000;
      return '<button class="row btn rcrow'+(cur&&cur.id===n.id?' on':'')+'" data-id="'+esc(n.id)+'" title="'+esc(fullPath(n))+'">'
        +'<span class="t">'+(nw?'<i class="new">새</i>':'')+(n.group==='skills'?'<i class="sk">스킬</i>':'')+esc(n.meta.ko_t||n.title)+'</span>'
        +'<span>'+ago(r.at)+(r.count>1?' · '+r.count+'회':'')+'</span></button>'}).join('')
    +(R.length>6?'<button class="row btn more" data-rcmore>'+(rcMore?'접기':'더 보기 ('+(R.length-6)+')')+'</button>':'')+'</div>';
}

function leftPanel(){
  const work=prof==='work', td=todayStr();
  let h='';
  if(work){
    h+='<div class="card">'+calHTML()+'</div>';
    h+='<div class="sec">'+fmtDate(calSel)+' 일정</div><div class="list">'+(evRows(evOn(calSel))||'<div class="empty">일정 없음</div>')+'</div>';
    h+=weeklyHTML(td);
    h+='<div class="sec">오늘 업무 (구글 캘린더)</div><div class="list">'
      +(evRows(evOn(td))||'<div class="empty">오늘 일정이 없습니다.</div>')
      +'<button class="row btn" data-id="MEMORY/마감일"><span class="t">마감일 메모</span><span>열기</span></button>'
      +'</div>';
    if(D.calendar.source==='sample')h+='<p class="foot">일정은 예시 데이터입니다.</p>';
  }else{
    h+='<button class="bigbtn'+(view==='prompt'?' on':'')+'" data-prompt><b>프롬프트 정리</b><span>요청을 스킬 지침으로 다듬어 가운데 탭에서 고치고 봅니다 · 저장 '+PH().length+'개</span></button>';
    h+='<div class="sec">관심 분야 자료</div>';
    const fo=focusIds();
    hubs.filter(hb=>fo.has(hb.id)).forEach(hb=>{
      const kids=catNotes(hb.group);
      h+='<div class="hubcard"><div class="hc-t"><span><i class="dot" style="background:'+COLOR[hb.group]+'"></i>'+esc(hb.title)+'</span><em>'+kids.length+'</em></div>'
        +kids.map(n=>'<button class="nav-item sub'+(cur&&cur.id===n.id?' on':'')+'" data-id="'+esc(n.id)+'">'+esc(n.title)+'</button>').join('')+'</div>';
    });
  }
  h+=recentHTML();
  const inbox=catNotes('inbox');
  h+='<div class="sec">기록</div>'
    +'<button class="nav-item" data-id="AGENTS">지침 (AGENTS)</button>'
    +'<button class="nav-item" data-id="MEMORY/_index">기억 목록</button>'
    +'<button class="nav-item" data-id="MEMORY/마감일">마감일</button>'
    +'<div class="sec">임시 보관함 '+inbox.length+'</div>'
    +inbox.map(n=>'<button class="nav-item sub" data-id="'+esc(n.id)+'">'+esc(n.title)+'</button>').join('');
  $('#leftbody').innerHTML=h;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===prof));
}

// ---- 크기 조절: 손잡이를 끌어 오른쪽 칸 너비, 메일·루틴 높이, 지도 옆 칸 너비를 바꾼다 (브라우저에 기억)
const SZ=(()=>{try{return JSON.parse(localStorage.getItem('sizes')||'{}')}catch(e){return {}}})();
const saveSZ=()=>localStorage.setItem('sizes',JSON.stringify(SZ));
const rbH=k=>SZ[k]?' style="flex:0 0 '+SZ[k]+'px;max-height:none"':'';
if(SZ.rw)document.documentElement.style.setProperty('--rw',SZ.rw+'px');
if(SZ.lw)document.documentElement.style.setProperty('--lw',SZ.lw+'px');
document.addEventListener('mousedown',e=>{
  const g=e.target.closest('[data-rs]');if(!g)return;
  e.preventDefault();
  const k=g.dataset.rs, sx=e.clientX, sy=e.clientY;
  let start, apply;
  if(k==='rw'){start=$('#right').offsetWidth;apply=(dx)=>{SZ.rw=Math.max(240,Math.min(720,start-dx));document.documentElement.style.setProperty('--rw',SZ.rw+'px');const cv=$('#bmap');if(cv)sizeMap(cv);if($('#smap'))drawLinks()}}
  else if(k==='lw'){start=document.querySelector('.left').offsetWidth;apply=(dx)=>{SZ.lw=Math.max(200,Math.min(520,start+dx));document.documentElement.style.setProperty('--lw',SZ.lw+'px');const cv=$('#bmap');if(cv)sizeMap(cv);if($('#smap'))drawLinks()}}
  else if(k==='bp'){const p=$('#bpanel');start=p.offsetWidth;apply=(dx)=>{SZ.bp=Math.max(260,Math.min(1000,start-dx));p.style.width=SZ.bp+'px';const cv=$('#bmap');if(cv)sizeMap(cv)}}
  else{const b=document.querySelector('.rblock[data-k="'+k+'"]');if(!b)return;start=b.offsetHeight;const down=k!=='routines';
    apply=(dx,dy)=>{SZ[k]=Math.max(70,Math.min($('#right').offsetHeight-160,start+(down?dy:-dy)));b.style.flex='0 0 '+SZ[k]+'px';b.style.maxHeight='none'}}

  text=(text||'').toLowerCase();if(!text.trim())return;
  SK_RULES.forEach(([re,names,w])=>{const m=text.match(re);if(m)names.forEach((nm,i)=>{if(!SKN.has(nm))return;sc.set(nm,(sc.get(nm)||0)+(w-i)*mul);(why[nm]=why[nm]||new Set()).add(m[0])})});
  const words=[...new Set(text.match(/[가-힣]{2,}|[a-z][a-z0-9-]{2,}/g)||[])].filter(w=>!SK_STOP.has(w));
  SKL.forEach(n=>{const h=skHay.get(n.name);let s=0;words.forEach(w=>{if(h.includes(w)){s++;(why[n.name]=why[n.name]||new Set()).add(w)}});if(s)sc.set(n.name,(sc.get(n.name)||0)+s*.7*mul)});
}
function matchSkills(n,k=3){
  const nodes=stNodes(),fin=nodes.find(isFinal),fr=fin?(stDraft(fin.id)||stReq(fin.id)||{}):{},r=stDraft(n.id)||stReq(n.id)||{};
  const sc=new Map(),why={};
  skScore([n.t,n.role,r.req,r.loc].join(' '),1,sc,why);        // 블록 자체
  skScore([pqIn,fr.req,fr.chk].join(' '),isFinal(n)?1:.35,sc,why);            // 최종 모습·전체 요청
  const fs=FIELDS[ST.field].skill;if(fs&&SKN.has(fs))sc.set(fs,(sc.get(fs)||0)+(isFinal(n)?2:1));
  return [...sc].filter(x=>x[1]>=2.5).sort((a,b)=>b[1]-a[1]).slice(0,k).map(([name,s])=>({name,s,n:SKN.get(name),why:[...(why[name]||[])].slice(0,3)}));
}

// ---- 지도: 분야는 큰 별, 파일은 그 별을 도는 작은 별. 분야를 누르면 카메라가 그 별로 확대된다.
const STARS=Array.from({length:170},(_,i)=>({x:Math.abs(Math.sin(i*12.9898)*43758.5453)%1,y:Math.abs(Math.sin(i*78.233)*12345.679)%1,r:Math.abs(Math.sin(i*4.1))*1.1+.25,p:i*.37}));
const FONT='"Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif';
function sizeMap(c){const r=c.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;
  W=r.width;H=r.height;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';
  ctxG=c.getContext('2d');ctxG.setTransform(d,0,0,d,0,0)}
// ---- 3D 지도: 분야 별은 기울어진 고리 위에, 파일 별은 분야 별을 감싸는 구 위에 놓인다.
// 끌어서 돌리고, 휠로 확대하고, 분야 별을 누르면 카메라가 그 별로 날아간다.
let yaw=0.6, pitch=0.42, camZ=0, zoomU=1, drag=null;
function catWorld(g){
  const i=CATS.findIndex(x=>x.g===g), N=CATS.length, R=Math.min(W,H)*0.4, a=-Math.PI/2+i*2*Math.PI/N;
  return [R*Math.cos(a),Math.sin(i*1.7)*R*0.10,R*Math.sin(a)];
}
function layout(){
  const R=Math.min(W,H)*0.4, focus=focusIds();
  const out={R,cats:[],notes:[]};
  CATS.forEach((c,i)=>{
    const [x,y,z]=catWorld(c.g);
    const dim=c.sub.some(s=>SECOND.includes(s))&&!c.sub.some(s=>focus.has('second-brain/'+s));
    const size=7+Math.sqrt(c.notes.length)*3.2;
    const cat={c,x,y,z,dim,size};out.cats.push(cat);
    const m=c.notes.length, shells=m>60?3:m>12?2:1;
    c.notes.forEach((n,k)=>{
      // 황금각으로 구 표면에 고르게 흩뿌리고, rot 만큼 분야 축을 중심으로 돈다
      const sh=k%shells, idx=Math.floor(k/shells), per=Math.ceil(m/shells);
      const r=size+24+sh*20, yy=per>1?1-2*(idx+.5)/per:0, rr=Math.sqrt(Math.max(0,1-yy*yy));
      const th=idx*2.39996+rot*2.2*(sh%2?-1:1)+i;
      out.notes.push({n,c,cat,dim,x:x+r*rr*Math.cos(th),y:y+r*yy*.85,z:z+r*rr*Math.sin(th)});
    });
  });
  return out;
}
function updateCam(){
  const [tx,ty,tz]=selG?catWorld(selG):[0,0,0], ts=(selG?focusS():1)*zoomU;
  camX+=(tx-camX)*.1; camY+=(ty-camY)*.1; camZ+=(tz-camZ)*.1; camS+=(ts-camS)*.1;
}
// 세계 좌표 → 화면 좌표 [x, y, 원근 배율, 깊이]
function proj(x,y,z){
  const qx=x-camX,qy=y-camY,qz=z-camZ, cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x1=qx*cy-qz*sy, z1=qx*sy+qz*cy, y2=qy*cp-z1*sp, z2=qy*sp+z1*cp;
  const Dd=Math.min(W,H)*1.5, f=Dd/Math.max(Dd*.3,Dd+z2);
  return [W/2+x1*f*camS, H/2+y2*f*camS, f, z2];
}
const fog=f=>Math.max(.28,Math.min(1,.35+.65*(f-.7)/.6));
const fadeA=()=>Math.max(0,Math.min(1,(camS/zoomU-1)/(focusS()-1||1)));
function hit(x,y){
  const L=layout(),fa=fadeA();let best=null,bd=1e9;
  for(const p of L.notes){
    if(selG&&p.c.g!==selG&&fa>.5)continue;
    const [sx,sy,f,d]=proj(p.x,p.y,p.z),dist=Math.hypot(x-sx,y-sy);
    if(dist<Math.max(7,5*f)&&d<bd){best={type:'note',n:p.n};bd=d}
  }
  if(best)return best;
  for(const p of L.cats){const [sx,sy,f]=proj(p.x,p.y,p.z);if(Math.hypot(x-sx,y-sy)<p.size*f*Math.min(camS,1.6)+6)return{type:'cat',g:p.c.g}}
  const [ox,oy]=proj(0,0,0);if(Math.hypot(x-ox,y-oy)<28)return{type:'center'};
  return null;
}
function pill(c,txt,x,y,align,alpha,bold){
  c.font=(bold?'700 13px ':'600 12px ')+FONT;
  const w=c.measureText(txt).width, h=22;
  const px=align==='center'?x-w/2:align==='right'?x-w:x;
  c.globalAlpha=alpha*.8;c.fillStyle='rgba(8,10,16,.66)';
  c.beginPath();if(c.roundRect)c.roundRect(px-7,y-h/2,w+14,h,7);else c.rect(px-7,y-h/2,w+14,h);c.fill();
  c.globalAlpha=alpha;c.fillStyle='#e7eaf3';c.textAlign='left';c.textBaseline='middle';c.fillText(txt,px,y);
}
function ring3d(c,cx,cy,cz,r,tilt){ // 수평 원을 원근으로 그린다
  c.beginPath();
  for(let i=0;i<=64;i++){const a=i/64*2*Math.PI,[sx,sy]=proj(cx+r*Math.cos(a),cy+Math.sin(a)*r*tilt,cz+r*Math.sin(a));i?c.lineTo(sx,sy):c.moveTo(sx,sy)}
  c.stroke();
}
function drawMap(t){
  updateCam();
  const c=ctxG,L=layout(),fa=fadeA();
  const [ox,oy,of]=proj(0,0,0);
  c.clearRect(0,0,W,H);
  // 배경 별: 시점에 따라 살짝 움직여 깊이감을 준다
  STARS.forEach(s=>{const px=((s.x*W-yaw*40*s.r)%W+W)%W,py=((s.y*H+pitch*30*s.r)%H+H)%H;
    c.globalAlpha=.18+.3*Math.abs(Math.sin(t/1100+s.p));c.fillStyle='#cfd8ff';c.beginPath();c.arc(px,py,s.r,0,7);c.fill()});
  // 바닥 격자 고리 (은하 원반)
  c.strokeStyle='rgba(143,180,255,.16)';c.lineWidth=1;
  [1,.62,1.35].forEach((m,j)=>{c.globalAlpha=(j?.45:1)*(1-fa*.85);ring3d(c,0,0,0,L.R*m,0)});
  const kOf=p=>(selG?(selG===p.c.g?1:1-fa*.92):1)*(p.dim?.35:1);
  // 분야 연결선
  L.cats.forEach(p=>{const [sx,sy,f]=proj(p.x,p.y,p.z),k=kOf(p);
    c.globalAlpha=.3*k*fog(f);c.strokeStyle=COLOR[p.c.g];c.beginPath();c.moveTo(ox,oy);c.lineTo(sx,sy);c.stroke();
    c.globalAlpha=(selG===p.c.g?.25:.12)*k;ring3d(c,p.x,p.y,p.z,p.size+24,.0);});
  // 그릴 것들을 깊이 순(먼 것부터)으로 모은다
  const items=[];
  L.notes.forEach(p=>{const s=proj(p.x,p.y,p.z);items.push({kind:'n',p,s,d:s[3]})});
  L.cats.forEach(p=>{const s=proj(p.x,p.y,p.z);items.push({kind:'c',p,s,d:s[3]})});
  items.push({kind:'o',s:[ox,oy,of],d:proj(0,0,0)[3]});
  items.sort((a,b)=>b.d-a.d);
  for(const it of items){
    const [sx,sy,f]=it.s, fg=fog(f);
    if(it.kind==='n'){const p=it.p,k=kOf(p),[cx2,cy2]=proj(p.cat.x,p.cat.y,p.cat.z);
      const sel=selN===p.n.id, hov=hovered&&hovered.type==='note'&&hovered.n.id===p.n.id, col=COLOR[p.n.group]||COLOR[p.c.g];
      c.globalAlpha=.22*k*fg;c.strokeStyle=col;c.lineWidth=.8;c.beginPath();c.moveTo(cx2,cy2);c.lineTo(sx,sy);c.stroke();c.lineWidth=1;
      const r=((sel||hov?5.5:3.2)+fa*1.2)*f*Math.sqrt(camS);
      const g=c.createRadialGradient(sx,sy,0,sx,sy,r*1.4);g.addColorStop(0,'#fff');g.addColorStop(.35,col);g.addColorStop(1,rgba(col,.0));
      c.globalAlpha=k*fg;c.fillStyle=g;c.beginPath();c.arc(sx,sy,r*1.4,0,7);c.fill();
      if(sel||hov){c.globalAlpha=1;c.strokeStyle='#fff';c.lineWidth=1.2;c.beginPath();c.arc(sx,sy,9*f,0,7);c.stroke();c.lineWidth=1}
    }else if(it.kind==='c'){const p=it.p,k=kOf(p),sel=selG===p.c.g,col=COLOR[p.c.g];
      const rr=p.size*f*(sel?1.2:1)*Math.min(camS,1.6), r2=rr*4.2;
      const gl=c.createRadialGradient(sx,sy,0,sx,sy,r2);gl.addColorStop(0,rgba(col,.5*k*fg));gl.addColorStop(1,rgba(col,0));
      c.globalAlpha=1;c.fillStyle=gl;c.beginPath();c.arc(sx,sy,r2,0,7);c.fill();
      // 공처럼 보이도록 빛이 왼쪽 위에서 비치는 구
      const sg=c.createRadialGradient(sx-rr*.35,sy-rr*.4,rr*.08,sx,sy,rr);
      sg.addColorStop(0,'#ffffff');sg.addColorStop(.25,col);sg.addColorStop(1,rgba(col,.35));
      c.globalAlpha=k*fg;c.fillStyle=sg;c.beginPath();c.arc(sx,sy,rr,0,7);c.fill();
      if(sel){c.globalAlpha=1;c.strokeStyle=col;c.lineWidth=1.5;c.beginPath();c.arc(sx,sy,rr+7,0,7);c.stroke();c.lineWidth=1}
      const txt=p.c.label+' · '+p.c.notes.length;
      if(sel)pill(c,txt,sx,sy-rr-22,'center',1,true);
      else if(!selG||fa<.5)pill(c,txt,sx,sy+rr+14,'center',k*fg,false);
    }else{
      const cg=c.createRadialGradient(ox,oy,0,ox,oy,62*of);
      cg.addColorStop(0,'rgba(232,184,106,.5)');cg.addColorStop(1,'rgba(232,184,106,0)');
      c.globalAlpha=1-fa*.7;c.fillStyle=cg;c.beginPath();c.arc(ox,oy,62*of,0,7);c.fill();
      const sg=c.createRadialGradient(ox-5*of,oy-5*of,1,ox,oy,15*of);sg.addColorStop(0,'#fff');sg.addColorStop(.3,COLOR.core);sg.addColorStop(1,rgba(COLOR.core,.4));
      c.fillStyle=sg;c.beginPath();c.arc(ox,oy,15*of,0,7);c.fill();
      if(fa<.6)pill(c,'AGENTS',ox,oy+30*of,'center',1-fa,false);
    }
  }
  // 파일 이름은 맨 위에: 고른 파일, 마우스 위의 파일, 확대된 분야의 파일(30개 이하)
  L.notes.forEach(p=>{const show=selN===p.n.id||(hovered&&hovered.type==='note'&&hovered.n.id===p.n.id)||(selG===p.c.g&&fa>.6&&p.c.notes.length<=30);
    if(!show)return;
    const [sx,sy,f]=proj(p.x,p.y,p.z),[cx2,cy2]=proj(p.cat.x,p.cat.y,p.cat.z);
    const ang=Math.atan2(sy-cy2,sx-cx2), right=Math.cos(ang)>=0;
    pill(c,p.n.meta.ko_t||p.n.title,sx+Math.cos(ang)*9,sy+Math.sin(ang)*9,right?'left':'right',fog(f),false);
  });
  c.globalAlpha=1;
}
function loop(t){
  const cv=$('#bmap');if(!cv){rafId=0;return}
  const dt=lastT?Math.min(.05,(t-lastT)/1000):0;lastT=t;
  if(spin&&!drag){rot+=dt*0.07;yaw+=dt*(selG?0.05:0.09)}
  drawMap(t);
  rafId=requestAnimationFrame(loop);
}
function startMap(){
  const cv=$('#bmap');if(!cv)return;
  cancelAnimationFrame(rafId);lastT=0;

  add({id:'ROOT',label:'업무 노트',kind:'root',g:'core'});

// ---- 검색
function search(term){
  const t=term.toLowerCase();
  const found=D.notes.filter(n=>(n.title+n.path+n.body).toLowerCase().includes(t));
  $('#main').innerHTML='<div class="crumb">검색</div><h1 class="title">'+esc(term)+'</h1><div class="list" style="margin-top:16px">'+(found.map(n=>{const i=n.body.toLowerCase().indexOf(t),snip=i>=0?n.body.slice(Math.max(0,i-30),i+60).replace(/\s+/g,' '):n.path;
    return '<button class="row btn" data-id="'+esc(n.id)+'" style="display:block"><span class="t" style="display:block">'+esc(n.title)+'</span><span style="display:block;margin-top:3px;text-align:left">'+esc(snip)+'</span></button>'}).join('')||'<div class="empty">결과 없음</div>')+'</div>';
  $('#main').scrollTop=0;
}

// ---- 화면 고르기
function render(){
  try{
    leftPanel();rightPanel();
    if(q)search(q);
    else if(cur)noteView(cur);
    else if(view==='prompt')promptView();
    else brain();

    $('#main').innerHTML='<div class="warn"><b>화면을 그리지 못했습니다.</b><br>'+esc(err.message)+'</div>';

  }
}

  if(sp){spin=!spin;sp.textContent=spin?'회전 멈춤':'회전 시작';return}
  if(e.target.closest('[data-back]')){if(!cur)view='brain';cur=null;render();return}
  if(e.target.closest('[data-prompt]')){view='prompt';cur=null;q='';$('#search').value='';$('#main').scrollTop=0;render();return}
  const cmb=e.target.closest('.cmbox');
  if(cmb&&e.target.closest('[data-cmadd],[data-cmdel],[data-cmcopy],[data-cmclear]')){
    const id=cmb.dataset.cmid, n=byId.get(id);
    if(e.target.closest('[data-cmadd]')){const r=($('#cmr')?.value||'').trim();if(!r){$('#cmr')?.focus();return}
      (CM[id]=CM[id]||[]).push({q:($('#cmq')?.value||'').trim(),r,at:todayStr()});cmQ='';saveCM();cmRefresh(id);return}
    const dl=e.target.closest('[data-cmdel]');
    if(dl){CM[id].splice(Number(dl.dataset.cmdel),1);if(!CM[id].length)delete CM[id];saveCM();cmRefresh(id);return}
    if(e.target.closest('[data-cmclear]')){delete CM[id];saveCM();cmRefresh(id);return}
    if(e.target.closest('[data-cmcopy]')&&n&&navigator.clipboard){navigator.clipboard.writeText(cmPrompt(n)).then(()=>{const m=$('#cmmsg');if(m)m.textContent='복사했습니다. 클로드 코드에 붙여넣으세요.'})}
    return;
  }
  if(e.target.closest('[data-rcmore]')){rcMore=!rcMore;leftPanel();return}
  const us=e.target.closest('[data-useskill]');
  if(us){pSkill=us.dataset.useskill;pDirty=false;view='prompt';cur=null;q='';$('#search').value='';$('#main').scrollTop=0;render();return}
  const fd=e.target.closest('[data-field]');
  if(fd){ST.field=fd.dataset.field;ST.sel=null;saveST();render();return}
  const nd=e.target.closest('[data-node]');
  if(nd){ST.sel=ST.sel===nd.dataset.node?null:nd.dataset.node;saveST();render();return}
  if(e.target.closest('[data-nsave]')){const d=stDraft(ST.sel);if(!d)return;
    (ST.req[ST.field]=ST.req[ST.field]||{})[ST.sel]={...d};delete ST.draft[ST.field][ST.sel];saveST();render();
    const m=$('#nmsg');if(m)m.textContent='저장했습니다. 아래 프롬프트에 반영됐습니다';return}
  const kp=e.target.closest('[data-skpick]');
  if(kp){const i=document.querySelector('[data-f="skill"]');if(i){i.value=i.value.trim()===kp.dataset.skpick?'':kp.dataset.skpick;i.dispatchEvent(new Event('input',{bubbles:true}));skmRefresh()}return}
  if(e.target.closest('[data-nundo]')){if(ST.draft[ST.field])delete ST.draft[ST.field][ST.sel];saveST();render();return}
  if(e.target.closest('[data-nclear]')){if(ST.req[ST.field])delete ST.req[ST.field][ST.sel];if(ST.draft[ST.field])delete ST.draft[ST.field][ST.sel];saveST();render();return}
  const pr=e.target.closest('[data-preset]');
  if(pr){const all=pr.dataset.preset==='all';
    if(!confirm(all?'요청, 모든 분야의 블록 요청·추가 블록, 프롬프트를 모두 비우고 처음부터 시작할까요? (저장한 프롬프트 목록은 남습니다)':FIELDS[ST.field].label+' 지도의 블록 요청과 추가한 블록을 모두 지울까요?'))return;
    if(all){ST={field:ST.field,sel:null,req:{},draft:{},extra:{}};pqIn='';pqOut=''}
    else{delete ST.req[ST.field];delete ST.draft[ST.field];delete ST.extra[ST.field];ST.sel=null}
    pDirty=false;saveST();render();return}
  if(e.target.closest('[data-nadd]')){const nm=($('#pnew')?.value||'').trim();if(!nm)return;
    const id='x'+Date.now();const L=$('#pnewg').value;(ST.extra[ST.field]=ST.extra[ST.field]||[]).push({id,L,t:nm,path:'',role:'직접 추가한 블록',links:[]});
    ST.sel=id;saveST();render();return}
  const pm=e.target.closest('[data-pm]');
  if(pm){pMode=pm.dataset.pm;render();return}
  if(e.target.closest('[data-psave]')){if(!pqOut.trim())return;const h=PH();h.unshift({req:pqIn.trim().slice(0,40),at:todayStr(),skill:pSkill,inp:pqIn,out:pqOut});localStorage.setItem('prompts',JSON.stringify(h.slice(0,30)));render();const m=$('#pmsg');if(m)m.textContent='저장했습니다';return}
  const pd=e.target.closest('[data-pdel]');
  if(pd){const h=PH();h.splice(Number(pd.dataset.pdel),1);localStorage.setItem('prompts',JSON.stringify(h));render();return}
  const ph=e.target.closest('[data-ph]');
  if(ph){const x=PH()[Number(ph.dataset.ph)];if(x){pqIn=x.inp||'';pqOut=x.out||'';pSkill=x.skill||pSkill;pDirty=true;render()}return}
  const cm=e.target.closest('[data-cm]');
  if(cm){calM=new Date(calM.getFullYear(),calM.getMonth()+Number(cm.dataset.cm),1);leftPanel();return}
  const day=e.target.closest('[data-day]');
  if(day){calSel=day.dataset.day;leftPanel();return}
  if(e.target.closest('[data-unsel]')){selN=null;updatePanel();return}
  const sl=e.target.closest('[data-sel]');
  if(sl){const n=byId.get(sl.dataset.sel);if(n){selN=n.id;selG=supOf(n.group);render()}return}
  const cat=e.target.closest('[data-cat]');
  if(cat){selN=null;selG=cat.dataset.cat||null;render();return}
  if(e.target.closest('[data-gen]')){
    pDirty=false;pqOut=genPrompt();
    render();return;
  }
  if(e.target.closest('[data-copy]')){if(pqOut&&navigator.clipboard)navigator.clipboard.writeText(pqOut).then(()=>{const m=$('#pmsg');if(m)m.textContent='복사했습니다'});return}
  const w=e.target.closest('[data-id]');
  if(w&&!w.classList.contains('bad')){cur=byId.get(w.dataset.id)||null;q='';$('#search').value='';render()}
});
$('#search').oninput=e=>{q=e.target.value.trim();render()};
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='gq'){gQ=el.value;return}
  if(el.id==='cmq'){cmQ=el.value;return}
  if(el.id==='pq'){pqIn=el.value;saveST();refreshOut();clearTimeout(window.__skT2);window.__skT2=setTimeout(()=>{const m=$('#smap');if(m){m.outerHTML=studioMap();drawLinks()}skmRefresh()},600)}
  else if(el.id==='pqo'){pqOut=el.value;pDirty=true;const c=$('#pcnt');if(c)c.textContent=pqOut.length.toLocaleString('ko-KR')}
  else if(el.dataset&&el.dataset.f&&ST.sel){
    // 입력은 임시 저장(draft)만 하고, [저장]을 눌러야 프롬프트에 들어간다
    const D2=ST.draft[ST.field]=ST.draft[ST.field]||{};const r=D2[ST.sel]=D2[ST.sel]||{...(stReq(ST.sel)||{})};r[el.dataset.f]=el.value;saveST();
    const saved=stReq(ST.sel)||{},dirty=!sameR(r,saved);
    const sv=document.querySelector('[data-nsave]');if(sv)sv.disabled=!dirty;const un=document.querySelector('[data-nundo]');if(un)un.disabled=!(dirty&&hasReq(saved));
    const m=$('#nmsg');if(m)m.textContent=dirty?'저장하지 않은 입력이 있습니다':hasReq(saved)?'프롬프트에 반영됨':'';
    nodeRefresh();clearTimeout(window.__skT);window.__skT=setTimeout(()=>{skmRefresh();const sm=$('#smap');if(sm){const sc=$('#main').scrollTop;sm.outerHTML=studioMap();drawLinks();$('#main').scrollTop=sc}},600)}
});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='pauto'){ST.auto=e.target.checked;saveST();render();return}
  if(id==='psk')pSkill=e.target.value;else if(id==='pfull')pFull=e.target.checked;else if(id==='pappr')pAppr=e.target.checked;else return;refreshOut()});
render();
(function live(){
  if(!window.EventSource||location.protocol==='file:')return;
  // 다시 불러오기 전 상태 복원
  try{const s=JSON.parse(sessionStorage.getItem('live')||'null');sessionStorage.removeItem('live');
    if(s){view=s.view||view;brainView=s.brainView||brainView;selG=s.selG;selN=s.selN&&byId.get(s.selN)?s.selN:null;
      cur=s.cur&&byId.get(s.cur)||null;rcMore=!!s.rcMore;
      if(cur)noteView(cur);else render();
      setTimeout(()=>{['#main','#leftbody','#bpanel'].forEach((q,i)=>{const e=$(q);if(e)e.scrollTop=s.sc[i]||0});
        const r=$('#cmr');if(r&&s.cmr)r.value=s.cmr;const q2=$('#cmq');if(q2&&s.cmq)q2.value=s.cmq;
        const si=$('#search');if(si&&s.q)si.value=s.q})}}catch(e){}
  const es=new EventSource('/events');let t=0;
  const dot=on=>document.querySelectorAll('.sec .live').forEach(d=>d.classList.toggle('off',!on));
  es.onopen=()=>dot(true);es.onerror=()=>dot(false);
  es.addEventListener('change',()=>{clearTimeout(t);t=setTimeout(()=>{
    const a=document.activeElement;
    // 글을 쓰는 중이면 쓰기를 마칠 때까지 기다린다
    if(a&&/TEXTAREA|INPUT/.test(a.tagName)&&a.value&&a.id!=='search'){a.addEventListener('blur',()=>es.dispatchEvent(new Event('change')),{once:true});return}
    try{sessionStorage.setItem('live',JSON.stringify({view,brainView,selG,selN,cur:cur&&cur.id,rcMore,q:$('#search')?.value||'',
      sc:['#main','#leftbody','#bpanel'].map(q=>$(q)?.scrollTop||0),cmr:$('#cmr')?.value||'',cmq:$('#cmq')?.value||''}))}catch(e){}
    location.reload()},300)});
})();
</script></body></html>
